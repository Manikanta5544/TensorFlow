name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend — Lint, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        env:
          APP_ENV: "test"
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production-use-only-32chars"
          DATABASE_URL: "sqlite:///:memory:"
          CORS_ORIGINS: "http://localhost:5173"
          AI_PROVIDER: "mock"
          AI_BASE_URL: "https://api.groq.com/openai/v1"
          AI_MODEL: "llama-3.3-70b-versatile"
          LOG_LEVEL: "WARNING"
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend-quality:
    name: Frontend — Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit backend dependencies
        working-directory: backend
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt || true

  post-deploy-health-check:
    name: Verify Production Health
    runs-on: ubuntu-latest

    needs:
      - backend-quality
      - frontend-quality

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for Render deployment
        run: sleep 60

      - name: Verify backend health endpoints
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is not configured. Skipping production health check."
            exit 0
          fi

          curl --fail --silent --show-error "$BACKEND_URL/health"
          curl --fail --silent --show-error "$BACKEND_URL/ready"

          echo "Production backend is healthy."